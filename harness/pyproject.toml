[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wpjudge"
version = "1.0.0"
description = "Judge every PHP function in a WordPress plugin or theme with the wp-judge v4 GGUF; one JSON report."
requires-python = ">=3.10"
dependencies = [
  "openai",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-php>=0.24,<0.26",
]

[project.optional-dependencies]
test = ["httpx", "pytest"]

[project.scripts]
wpjudge = "wpjudge.cli:main"

[tool.setuptools]
packages = ["wpjudge"]
